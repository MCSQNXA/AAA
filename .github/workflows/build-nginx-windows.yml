name: Build NGINX 1.31.6 for Windows with njs

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the verified Windows build as a GitHub Release
        type: boolean
        required: true
        default: true

permissions:
  contents: write

jobs:
  build:
    name: Build native Windows x64 binary
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Check out workflow repository
        uses: actions/checkout@v4

      - name: Set up MSYS2 build tools
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          update: true
          install: base-devel perl

      - name: Set up Microsoft C/C++ compiler
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Download official NGINX, njs, and dependency sources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $buildRoot = Join-Path $env:RUNNER_TEMP 'nginx-build'
          New-Item -ItemType Directory -Force $buildRoot | Out-Null

          $archives = @(
            @{ Name = 'nginx-1.31.6.tar.gz'; Uri = 'https://nginx.org/download/nginx-1.31.6.tar.gz' },
            @{ Name = 'njs-1.0.1.tar.gz'; Uri = 'https://github.com/nginx/njs/archive/refs/tags/1.0.1.tar.gz' },
            @{ Name = 'pcre2-10.48.tar.gz'; Uri = 'https://github.com/PCRE2Project/pcre2/releases/download/pcre2-10.48/pcre2-10.48.tar.gz' },
            @{ Name = 'zlib-1.3.2.tar.gz'; Uri = 'https://zlib.net/fossils/zlib-1.3.2.tar.gz' },
            @{ Name = 'openssl-3.5.8.tar.gz'; Uri = 'https://www.openssl.org/source/openssl-3.5.8.tar.gz' }
          )

          foreach ($archive in $archives) {
            $destination = Join-Path $buildRoot $archive.Name
            Invoke-WebRequest -Uri $archive.Uri -OutFile $destination
            tar.exe -xzf $destination -C $buildRoot
            if ($LASTEXITCODE -ne 0) { throw "Could not extract $($archive.Name)" }
          }

          $nginxRoot = Join-Path $buildRoot 'nginx-1.31.6'
          $libRoot = Join-Path $nginxRoot 'objs\lib'
          New-Item -ItemType Directory -Force $libRoot | Out-Null
          foreach ($dependency in @('pcre2-10.48', 'zlib-1.3.2', 'openssl-3.5.8')) {
            Move-Item -LiteralPath (Join-Path $buildRoot $dependency) -Destination $libRoot
          }

          if (-not (Test-Path (Join-Path $buildRoot 'njs-1.0.1\nginx\config'))) {
            throw 'The pinned njs source archive did not contain the NGINX module config.'
          }

      - name: Configure and compile NGINX with statically built njs
        shell: msys2 {0}
        run: |
          set -euo pipefail
          printf 'RUNNER_TEMP=%s\n' "$RUNNER_TEMP"
          build_root="$(cygpath -u "$RUNNER_TEMP")/nginx-build"
          nginx_configure="$(find "$build_root" -type f -path '*/nginx-1.31.6/auto/configure' -print -quit)"
          if [ -z "$nginx_configure" ]; then
            printf 'Could not find NGINX auto/configure under %s\n' "$build_root"
            find "$build_root" -maxdepth 3 -type d -print | head -n 40
            exit 1
          fi
          cd "$(dirname "$(dirname "$nginx_configure")")"
          printf 'Building from %s\n' "$PWD"
          auto/configure \
            --with-cc=cl \
            --sbin-path=nginx.exe \
            --conf-path=conf/nginx.conf \
            --pid-path=logs/nginx.pid \
            --http-log-path=logs/access.log \
            --error-log-path=logs/error.log \
            --http-client-body-temp-path=temp/client_body_temp \
            --http-proxy-temp-path=temp/proxy_temp \
            --http-fastcgi-temp-path=temp/fastcgi_temp \
            --http-scgi-temp-path=temp/scgi_temp \
            --http-uwsgi-temp-path=temp/uwsgi_temp \
            --with-cc-opt=-DFD_SETSIZE=1024 \
            --with-pcre=objs/lib/pcre2-10.48 \
            --with-zlib=objs/lib/zlib-1.3.2 \
            --with-openssl=objs/lib/openssl-3.5.8 \
            --with-openssl-opt=no-asm \
            --with-http_ssl_module \
            --add-module=../njs-1.0.1/nginx
          nmake

      - name: Verify NGINX version and njs HTTP directives at runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $nginxRoot = Join-Path $env:RUNNER_TEMP 'nginx-build\nginx-1.31.6'
          $nginxExe = Join-Path $nginxRoot 'objs\nginx.exe'
          if (-not (Test-Path $nginxExe)) { throw 'nginx.exe was not produced.' }

          $buildInfo = (& $nginxExe -V 2>&1 | Out-String)
          if ($buildInfo -notmatch 'nginx/1\.31\.6') { throw 'The executable is not NGINX 1.31.6.' }
          if ($buildInfo -notmatch '--add-module=.*njs-1\.0\.1[\\/]nginx') {
            throw 'The NGINX build arguments do not show the njs module.'
          }

          $confRoot = Join-Path $nginxRoot 'conf'
          $njsRoot = Join-Path $env:RUNNER_TEMP 'nginx-build\njs-1.0.1'
          New-Item -ItemType Directory -Force (Join-Path $nginxRoot 'logs'), (Join-Path $nginxRoot 'temp'), (Join-Path $nginxRoot 'njs') | Out-Null
          Copy-Item (Join-Path $njsRoot 'LICENSE') (Join-Path $env:RUNNER_TEMP 'LICENSE.njs')
          @'
          function hello(r) { r.return(200, 'NJS_OK'); }
          export default { hello };
          '@ | Set-Content -Encoding utf8 (Join-Path $nginxRoot 'njs\hello.js')

          $smokeConfig = @'
          worker_processes 1;
          error_log logs/error.log notice;
          pid logs/nginx.pid;
          events { worker_connections 128; }
          http {
              js_path "njs/";
              js_import probe from hello.js;
              server {
                  listen 127.0.0.1:18081;
                  location = /njs { js_content probe.hello; }
              }
          }
          '@
          Set-Content -Encoding utf8 (Join-Path $confRoot 'nginx-smoke.conf') $smokeConfig
          $prefix = $nginxRoot.Replace('\', '/') + '/'
          & $nginxExe -t -p $prefix -c conf/nginx-smoke.conf
          if ($LASTEXITCODE -ne 0) { throw 'nginx -t rejected the njs smoke-test configuration.' }

          $server = Start-Process -FilePath $nginxExe -ArgumentList @('-p', $prefix, '-c', 'conf/nginx-smoke.conf') -WorkingDirectory $nginxRoot -PassThru
          try {
            $response = $null
            for ($attempt = 0; $attempt -lt 15; $attempt++) {
              try {
                $response = Invoke-WebRequest -Uri 'http://127.0.0.1:18081/njs' -TimeoutSec 2
                break
              } catch {
                Start-Sleep -Seconds 1
              }
            }
            if ($null -eq $response -or $response.StatusCode -ne 200 -or $response.Content.Trim() -ne 'NJS_OK') {
              throw 'The Windows nginx.exe did not execute the njs HTTP handler.'
            }
          } finally {
            & $nginxExe -p $prefix -c conf/nginx-smoke.conf -s stop
            if (-not $server.HasExited) { $server.WaitForExit(10000) | Out-Null }
          }

      - name: Package Windows x64 distribution
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $buildRoot = Join-Path $env:RUNNER_TEMP 'nginx-build'
          $nginxRoot = Join-Path $buildRoot 'nginx-1.31.6'
          $distRoot = Join-Path $env:RUNNER_TEMP 'nginx-1.31.6-windows-x64-njs-1.0.1'
          $archive = Join-Path $env:RUNNER_TEMP 'nginx-1.31.6-windows-x64-njs-1.0.1.zip'
          New-Item -ItemType Directory -Force (Join-Path $distRoot 'conf'), (Join-Path $distRoot 'html'), (Join-Path $distRoot 'logs'), (Join-Path $distRoot 'temp'), (Join-Path $distRoot 'njs') | Out-Null
          Copy-Item (Join-Path $nginxRoot 'objs\nginx.exe') (Join-Path $distRoot 'nginx.exe')
          Copy-Item (Join-Path $nginxRoot 'conf\mime.types') (Join-Path $distRoot 'conf\mime.types')
          Copy-Item (Join-Path $nginxRoot 'html\*') (Join-Path $distRoot 'html') -Recurse
          Copy-Item (Join-Path $nginxRoot 'njs\hello.js') (Join-Path $distRoot 'njs\hello.js')

          @'
          worker_processes 1;
          error_log logs/error.log warn;
          pid logs/nginx.pid;
          events { worker_connections 1024; }
          http {
              include mime.types;
              default_type application/octet-stream;
              sendfile on;
              keepalive_timeout 65;
              js_path "njs/";
              js_import demo from hello.js;
              server {
                  listen 80;
                  server_name localhost;
                  location = /njs { js_content demo.hello; }
                  location / { root html; index index.html; }
              }
          }
          '@ | Set-Content -Encoding utf8 (Join-Path $distRoot 'conf\nginx.conf')

          Copy-Item (Join-Path $nginxRoot 'LICENSE') (Join-Path $distRoot 'LICENSE.nginx')
          Copy-Item (Join-Path $buildRoot 'njs-1.0.1\LICENSE') (Join-Path $distRoot 'LICENSE.njs')
          Copy-Item (Join-Path $nginxRoot 'objs\lib\pcre2-10.48\LICENCE.md') (Join-Path $distRoot 'LICENSE.pcre2')
          Copy-Item (Join-Path $nginxRoot 'objs\lib\zlib-1.3.2\LICENSE') (Join-Path $distRoot 'LICENSE.zlib')
          Copy-Item (Join-Path $nginxRoot 'objs\lib\openssl-3.5.8\LICENSE.txt') (Join-Path $distRoot 'LICENSE.openssl')

          @'
          NGINX 1.31.6 for Windows x64 with njs 1.0.1

          This is a native 64-bit Windows build. The njs HTTP module is statically
          linked into nginx.exe and is exercised by the included /njs endpoint.

          Run nginx.exe from this directory. The default configuration serves
          http://localhost/ and demonstrates njs at http://localhost/njs.
          Stop NGINX with: nginx.exe -s stop

          Build dependencies: PCRE2 10.48, zlib 1.3.2, OpenSSL 3.5.8.
          License texts for bundled components are included in this directory.
          '@ | Set-Content -Encoding utf8 (Join-Path $distRoot 'README.txt')

          if (Test-Path $archive) { Remove-Item -LiteralPath $archive -Force }
          Compress-Archive -Path (Join-Path $distRoot '*') -DestinationPath $archive -CompressionLevel Optimal
          $sha = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          Set-Content -NoNewline -Encoding ascii (Join-Path $env:RUNNER_TEMP 'SHA256SUMS.txt') "$sha  $(Split-Path $archive -Leaf)"

      - name: Publish verified build as a GitHub Release
        if: ${{ github.event_name == 'push' || inputs.publish_release }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "v1.31.6-njs1.0.1-build.$env:GITHUB_RUN_NUMBER.$env:GITHUB_RUN_ATTEMPT"
          $archive = Join-Path $env:RUNNER_TEMP 'nginx-1.31.6-windows-x64-njs-1.0.1.zip'
          $checksums = Join-Path $env:RUNNER_TEMP 'SHA256SUMS.txt'
          gh release create $tag $archive $checksums --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'NGINX 1.31.6 + njs 1.0.1 (Windows x64)' --notes 'Native Windows x64 Release. The njs HTTP module is statically linked into nginx.exe and verified by an HTTP smoke test.'
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release creation failed.' }